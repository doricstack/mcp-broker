name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # The floor interpreter is installed first so the newer "3.x" below stays
      # the active one. Without it the floor import contract silently skips and
      # CI only ever proves the newest Python, which is how a module using a
      # 3.11-only name shipped under a ">=3.10" floor.
      - name: Set up floor Python
        id: floor-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Expose the floor interpreter to the suite
        run: echo "PYTHON_FLOOR_INTERPRETER=${{ steps.floor-python.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: Install project
        run: make setup RUNTIME_ROOT="$RUNNER_TEMP/mcp-broker"

      - name: Run public precommit gate
        run: make precommit RUNTIME_ROOT="$RUNNER_TEMP/mcp-broker"

      - name: Check release version metadata
        run: make publish-version-check

      - name: Check NPM package wrapper
        run: make npm-package-check

      - name: Run NPM wrapper smoke
        run: make npm-smoke

      - name: Run release smoke
        run: make release-smoke

      - name: Check package artifacts
        run: make package-check

  # pyproject offers `jsonschema>=4.25.1`, so that lower bound is what a user is
  # permitted to install, yet the job above always resolves the newest version.
  # Without this leg the declared floor is never executed, which is exactly how a
  # published release shipped a 3.11-only name under a ">=3.10" floor. The pins are
  # asserted against pyproject by tests/journey/test_dependency_floor_contract.py,
  # so raising a floor without proving it fails the suite rather than going quiet.
  dependency-floors:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up floor Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install project
        run: make setup RUNTIME_ROOT="$RUNNER_TEMP/mcp-broker"

      - name: Downgrade runtime dependencies to their declared floors
        run: make deps-floor RUNTIME_ROOT="$RUNNER_TEMP/mcp-broker"

      - name: Run the suite against the declared floors
        run: make test RUNTIME_ROOT="$RUNNER_TEMP/mcp-broker"
