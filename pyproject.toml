[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-broker"
description = "Local MCP broker for sharing upstream MCP servers across MCP clients"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Navin B Agrawal" }]
dynamic = ["version"]
dependencies = [
    "jsonschema>=4.25.1",
    "PyYAML>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/doricstack/mcp-broker"
Documentation = "https://github.com/doricstack/mcp-broker#readme"
Issues = "https://github.com/doricstack/mcp-broker/issues"

[project.scripts]
mcp-broker = "mcp_broker.cli:main"
mcp-broker-client = "mcp_broker.client:main"
mcp-broker-daemon = "mcp_broker.daemon:main"

[tool.mcp-broker]
# The newest interpreter CI proves the suite on. requires-python declares a floor
# and no upper bound, so without naming a ceiling the newest supported Python is
# whatever a runner happens to ship that day. A CI leg tracking "3.x" proves that
# moving target rather than a stated one, which is how thirteen assertions
# comparing raw argparse help text passed on 3.13 and failed on 3.14.
# Raising this is a deliberate edit; CI reads the value from here.
python-ceiling = "3.14"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "mcp_broker.__version__"}

[tool.setuptools.data-files]
"share/mcp-broker/config" = ["config/broker.example.yaml"]
