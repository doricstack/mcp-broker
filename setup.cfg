[mutmut]
paths_to_mutate=src/mcp_broker
also_copy=
    brand
    config
    docs
    docker
    mk
    mcpb
    npm
    public-export
    registry
    scripts
    .cits
    .githooks
    .gitignore
    .codex-plugin
    .github
    .well-known
    .dockerignore
    CHANGELOG.md
    CONTRIBUTING.md
    glama.json
    LICENSE
    ROADMAP.md
    SECURITY.md
    Dockerfile
    Makefile
    pyproject.toml
    pytest.ini
    README.md
    requirements.txt
tests_dir=
    tests/unit
    tests/journey
pytest_add_cli_args=
    --timeout=30
    -m
    not private_contract
# -1 disables mutmut's stack walk in record_trampoline_hit. That walk resolves
# every stack frame's filename and raises on the frames a `python -m` entry
# point leaves behind: the daemon reached through a subprocess has no pytest
# frame to stop at, so the walk runs into <frozen runpy> and the process dies
# with FileNotFoundError.
max_stack_depth=-1
mutate_only_covered_lines=true
